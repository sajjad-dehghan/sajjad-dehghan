name: Generate contribution animation

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the profile source
        uses: actions/checkout@v5

      - name: Generate the real contribution snake game
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          outputs: |
            dist/github-activity-snake.svg?color_snake=#2F7D66&color_dots=#EEF2F0,#CFE7DD,#9ED0BC,#5FA98F,#2F7D66
            dist/github-activity-snake-dark.svg?palette=github-dark&color_snake=#9ED0BC&color_dots=#111412,#1F3A31,#2F5E4F,#5FA98F,#9ED0BC

      - name: Add calendar labels and weighted progress
        run: node scripts/enhance-snake.mjs
        env:
          GITHUB_USERNAME: ${{ github.repository_owner }}

      - name: Publish animation
        uses: crazy-max/ghaction-github-pages@v5
        with:
          build_dir: dist
          target_branch: output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
